<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People you may know · OLANET</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#1d4348;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}.logo{font-weight:900;font-size:23px;color:#2f817d}.back{width:40px;height:40px;border:0;border-radius:50%;background:#eef1f1;font-size:24px;cursor:pointer}.search{flex:1;max-width:560px;border:0;background:#f0f2f5;border-radius:999px;padding:12px 18px;font-size:15px;outline:0}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h1{margin:0;font-size:28px}.head p{margin:6px 0 0;color:#65676b}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:0;border-radius:8px;background:#fff;padding:10px 16px;font-weight:700;cursor:pointer}.tabs button.active{background:#2f817d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002}.person{display:flex;align-items:center;gap:12px}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#dceceb;display:grid;place-items:center;font-weight:900;font-size:20px;color:#1d4348;flex:none}.copy{min-width:0}.copy h3{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{margin:4px 0;color:#65676b;font-size:13px}.copy small{display:block;color:#65676b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button{border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}.add{background:#2f817d;color:#fff}.msg{background:#e7f3ff;color:#216763}.actions button:disabled{opacity:.55;cursor:default}.empty{background:#fff;border-radius:12px;padding:50px;text-align:center;color:#65676b}.error{color:#b42318;margin:8px 0 14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{display:block}.search{max-width:none}.bar{flex-wrap:wrap}}
</style></head><body><header class="top"><div class="bar"><button class="back" id="back" type="button" aria-label="Back to OLANET home">‹</button><div class="logo">OLANET</div><input id="search" class="search" placeholder="Search people by name or username" autocomplete="off"></div></header><main class="wrap"><div class="head"><div><h1>People you may know</h1><p>Find students, professionals and builders on OLANET.</p></div></div><div class="tabs"><button class="active" data-mode="suggested">Suggested for you</button><button data-mode="all">All people</button></div><div id="error" class="error"></div><section id="grid" class="grid"><div class="empty">Checking your OLANET session…</div></section></main><script>
const grid=document.getElementById('grid'),error=document.getElementById('error'),search=document.getElementById('search');let timer,mode='suggested',sessionChecked=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=p=>(p.full_name||p.username||'OL').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
async function api(url,opts={}){const r=await fetch(url,{...opts,cache:'no-store',credentials:'include',headers:{...(opts.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Object.assign(Error(d?.error||`Request failed (${r.status})`),{status:r.status});return d}
async function ensureSession(){if(sessionChecked)return true;try{await api('/api/auth/session');sessionChecked=true;return true}catch(e){if(e.status===401){grid.innerHTML='<div class="empty">Your OLANET login has expired. Please log in again.</div>';error.textContent='Your session is no longer active.';return false}error.textContent=e.message||'Please log in to continue';grid.innerHTML='<div class="empty">Unable to verify your OLANET session.</div>';return false}}
function uniqueUsers(users){const seen=new Set();return users.filter(p=>{const key=[p.id,p.username||'',p.full_name||'',p.avatar_url||''].join('|');if(seen.has(key))return false;seen.add(key);return true})}
function render(users){const clean=uniqueUsers(users);const visible=mode==='suggested'?clean.slice(0,6):clean;grid.innerHTML=visible.length?visible.map(p=>`<article class="card"><div class="person">${p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="">`:`<div class="avatar">${esc(initials(p))}</div>`}<div class="copy"><h3>${esc(p.full_name||p.username||'OLANET user')}</h3><p>@${esc(p.username||'member')}</p><small>${esc(p.bio||'OLANET member')}</small></div></div><div class="actions"><button class="add" data-id="${esc(p.id)}">Add Friend</button><button class="msg" data-id="${esc(p.id)}">Message</button></div></article>`).join(''):`<div class="empty">No other OLANET users found.</div>`;bind()}
function bind(){document.querySelectorAll('.add').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Sending…';try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({addressee_id:b.dataset.id})});b.textContent='Request Sent'}catch(e){b.disabled=false;b.textContent='Add Friend';error.textContent=e.message}});document.querySelectorAll('.msg').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Opening…';try{const c=await api('/api/conversations',{method:'POST',body:JSON.stringify({user_ids:[b.dataset.id]})});location.href='/messages?conversation='+encodeURIComponent(c.id)}catch(e){b.disabled=false;b.textContent='Message';error.textContent=e.message}})}
async function load(){if(!(await ensureSession()))return;try{error.textContent='';grid.innerHTML='<div class="empty">Loading people…</div>';const q=search.value.trim();const users=await api('/api/people'+(q?'?q='+encodeURIComponent(q):''));render(Array.isArray(users)?users:[])}catch(e){if(e.status===401){grid.innerHTML='<div class="empty">Your OLANET login has expired. Please log in again.</div>';error.textContent='Your session is no longer active.';return}grid.innerHTML='<div class="empty">People could not be loaded right now.</div>';error.textContent=e.message||'Could not load people'}}
search.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode||'suggested';document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()});
document.getElementById('back').onclick=()=>{window.location.assign('/');};
load();
</script></body></html>
