<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLANET Department Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#172b2f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.wrap{max-width:760px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e6e8ea;background:#fff}.back{border:0;background:#f0f2f4;border-radius:50%;width:40px;height:40px;cursor:pointer}.title{font-weight:800;font-size:18px}.sub{font-size:12px;color:#718084;margin-top:2px}.content{padding:18px 16px 34px}.hero{border:1px solid #e2e6e8;border-radius:20px;padding:18px;background:#fff;margin-bottom:16px}.hero h1{font-size:27px;line-height:1.15;margin:0 0 7px}.hero p{margin:0;color:#66777b;font-size:14px;line-height:1.6}.dept-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.dept{border:1px solid #e2e6e8;background:#fff;border-radius:15px;padding:13px;text-align:left;cursor:pointer;font-weight:750;color:#203438}.dept.active{border-color:#1877f2;background:#eef5ff;color:#0b5ed7}.dept small{display:block;color:#7b898d;font-weight:500;margin-top:4px}.card{border:1px solid #e2e6e8;border-radius:20px;padding:17px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:750;color:#5f7074;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d7dde0;border-radius:12px;background:#fafbfc;outline:0}.field input:focus,.field select:focus{border-color:#1877f2;background:#fff}.calc{width:100%;border:0;border-radius:13px;padding:13px;background:#1877f2;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:15px;border-radius:15px;background:#f0f6ff;border:1px solid #d5e6ff;padding:15px}.result b{display:block;font-size:23px;color:#0b5ed7}.result span{font-size:12px;color:#607176}.note{font-size:11px;color:#7b898d;margin-top:10px;line-height:1.5}@media(max-width:560px){.dept-grid,.row{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><button class="back" onclick="goBack()">‹</button><div><div class="title" id="topTitle">Department Calculator</div><div class="sub">OLANET · practical calculations</div></div></header>
<main class="content">
<section class="hero"><h1 id="pageTitle">Departmental Calculator</h1><p>Choose the department, then use the calculator built for that field. Because apparently every profession needed its own little box of mathematics.</p><div class="dept-grid" id="departments"></div></section>
<section class="card"><h2 id="calcTitle" style="margin:0 0 16px;font-size:21px">Calculator</h2><div id="fields"></div><button class="calc" onclick="calculate()">Calculate</button><div class="result"><b id="result">Enter values above</b><span id="formula">Your result will appear here.</span></div><div class="note" id="note"></div></section>
</main></div>
<script>
const D={
 electrical:{name:'Electrical Engineering',icon:'⚡',tools:[['Ohm’s Law','ohm'],['3-phase Power','three'],['Voltage Drop','drop'],['Lighting Lumens','lumens']]},
 civil:{name:'Civil Engineering',icon:'🏗️',tools:[['Concrete Volume','concrete'],['Area','area'],['Rebar Weight','rebar'],['Load Estimate','load']]},
 mechanical:{name:'Mechanical Engineering',icon:'⚙️',tools:[['Torque','torque'],['Mechanical Power','mechpower'],['Gear Ratio','gear'],['Pressure','pressure']]},
 'computer-science':{name:'Computer Science',icon:'💻',tools:[['Binary → Decimal','binary'],['Subnet Hosts','subnet'],['Storage','storage'],['Hex → Decimal','hex']]},
 'phone-repair':{name:'Phone Repair',icon:'🔧',tools:[['Power','power'],['Battery Runtime','battery'],['Charging Time','charge'],['Current from Power','current']]},
 fashion:{name:'Fashion',icon:'✂️',tools:[['Fabric Length','fabric'],['Measurement Scale','measure'],['Garment Cost','garment'],['Yarn Estimate','yarn']]},
 carpentry:{name:'Carpentry',icon:'🪚',tools:[['Board Feet','board'],['Material Cost','woodcost'],['Cut Length','cut'],['Right Angle','angle']]},
 agriculture:{name:'Agriculture',icon:'🌱',tools:[['Plant Density','density'],['Fertilizer','fertilizer'],['Yield','yield'],['Farm Area','farmarea']]},
 catering:{name:'Catering',icon:'🍲',tools:[['Recipe Scaling','recipe'],['Servings','servings'],['Cost per Serving','servcost'],['Ingredient Cost','ingcost']]}
};
let dept=new URLSearchParams(location.search).get('department')||'electrical'; if(!D[dept])dept='electrical'; let tool=D[dept].tools[0][1];
const q=new URLSearchParams(location.search); const esc=s=>String(s).replace(/</g,'&lt;');
function goBack(){if(history.length>1)history.back();else location.href='/circles/'+encodeURIComponent(dept)}
function renderDepts(){document.getElementById('departments').innerHTML=Object.entries(D).map(([k,v])=>`<button class="dept ${k===dept?'active':''}" onclick="setDept('${k}')">${v.icon} ${esc(v.name)}<small>${v.tools.length} calculators</small></button>`).join('')}
function setDept(k){dept=k;tool=D[k].tools[0][1];history.replaceState({},'',`/department-calculator.html?department=${encodeURIComponent(k)}`);render();}
function render(){const d=D[dept];document.getElementById('topTitle').textContent=d.name;document.getElementById('pageTitle').textContent=d.name+' Calculator';document.getElementById('calcTitle').textContent=d.tools.find(x=>x[1]===tool)?.[0]||'Calculator';renderDepts();const choices=d.tools.map(([n,id])=>`<option value="${id}" ${id===tool?'selected':''}>${n}</option>`).join('');document.getElementById('fields').innerHTML=`<div class="field"><label>Calculator</label><select onchange="tool=this.value;render()">${choices}</select></div><div class="row" id="inputs"></div>`;renderInputs();document.getElementById('result').textContent='Enter values above';document.getElementById('formula').textContent='';document.getElementById('note').textContent='';}
function input(id,label,placeholder='0'){return `<div class="field"><label>${label}</label><input id="${id}" type="number" step="any" placeholder="${placeholder}"></div>`}
function renderInputs(){const I={
 ohm:input('v','Voltage (V)')+input('r','Resistance (Ω)'),three:input('v','Voltage (V)')+input('i','Current (A)')+input('pf','Power factor','0.8'),drop:input('i','Current (A)')+input('l','Length (m)')+input('res','Cable resistance Ω/m'),lumens:input('lamp','Lumens per lamp')+input('n','Number of lamps'),
 concrete:input('l','Length (m)')+input('w','Width (m)')+input('h','Depth (m)'),area:input('l','Length')+input('w','Width'),rebar:input('d','Bar diameter (mm)')+input('len','Total length (m)')+input('n','Number of bars'),load:input('area','Loaded area (m²)')+input('load','Load (kN/m²)'),
 torque:input('force','Force (N)')+input('radius','Radius (m)'),mechpower:input('torque','Torque (N·m)')+input('rpm','RPM'),gear:input('driver','Driver teeth')+input('driven','Driven teeth'),pressure:input('force','Force (N)')+input('area','Area (m²)'),
 binary:input('bin','Binary value'),subnet:input('prefix','CIDR prefix','24'),storage:input('gb','Gigabytes')+input('mb','Megabytes'),hex:input('hexv','Hex value'),
 power:input('v','Voltage (V)')+input('i','Current (A)'),battery:input('mah','Battery capacity (mAh)')+input('ma','Average current (mA)'),charge:input('mah','Battery capacity (mAh)')+input('ma','Charger current (mA)'),current:input('w','Power (W)')+input('v','Voltage (V)'),
 fabric:input('width','Fabric width (m)')+input('area','Required fabric area (m²)'),measure:input('base','Base measurement')+input('scale','Scale factor','1'),garment:input('fabric','Fabric cost (₦)')+input('labour','Labour (₦)')+input('other','Other cost (₦)'),yarn:input('weight','Yarn weight (g)')+input('length','Length (m)'),
 board:input('width','Board width (in)')+input('thick','Board thickness (in)')+input('length','Length (ft)'),woodcost:input('unit','Cost per board (₦)')+input('n','Number of boards'),cut:input('start','Starting length (mm)')+input('cut','Cut length (mm)'),angle:input('a','Side A')+input('b','Side B'),
 density:input('plants','Number of plants')+input('area','Farm area (m²)'),fertilizer:input('area','Farm area (ha)')+input('rate','Rate (kg/ha)'),yield:input('bags','Bags harvested')+input('weight','Weight per bag (kg)'),farmarea:input('length','Length (m)')+input('width','Width (m)'),
 recipe:input('original','Original servings')+input('target','Target servings'),servings:input('food','Food quantity (kg)')+input('portion','Portion size (kg)'),servcost:input('cost','Total food cost (₦)')+input('serv','Number of servings'),ingcost:input('qty','Quantity')+input('unit','Unit price (₦)')
};document.getElementById('inputs').innerHTML=I[tool]||'';}
function n(id){return Number(document.getElementById(id)?.value)||0} function out(v,f,note=''){document.getElementById('result').textContent=v;document.getElementById('formula').textContent=f;document.getElementById('note').textContent=note}
function calculate(){try{switch(tool){case'ohm':out((n('v')/n('r')).toFixed(3)+' A','I = V / R');break;case'three':out((1.732*n('v')*n('i')*n('pf')/1000).toFixed(2)+' kW','P = √3 × V × I × pf');break;case'drop':out((n('i')*n('l')*n('res')).toFixed(2)+' V','Vdrop = I × L × R');break;case'lumens':out((n('lamp')*n('n')).toLocaleString()+' lm','Total lumens = lamp lumens × quantity');break;case'concrete':out((n('l')*n('w')*n('h')).toFixed(3)+' m³','Volume = L × W × H');break;case'area':out((n('l')*n('w')).toFixed(2)+' m²','Area = L × W');break;case'rebar':out((n('d')*n('d')/162*n('len')*n('n')).toFixed(2)+' kg','Approx. steel weight = d²/162 × length × bars');break;case'load':out((n('area')*n('load')).toFixed(2)+' kN','Load = area × load intensity');break;case'torque':out((n('force')*n('radius')).toFixed(2)+' N·m','Torque = Force × radius');break;case'mechpower':out((2*Math.PI*n('rpm')*n('torque')/60000).toFixed(2)+' kW','P = 2πNT/60000');break;case'gear':out((n('driven')/n('driver')).toFixed(3)+' : 1','Gear ratio = driven / driver');break;case'pressure':out((n('force')/n('area')).toFixed(2)+' Pa','Pressure = Force / Area');break;case'binary':out(parseInt(document.getElementById('bin').value||'0',2)+' decimal','Binary → decimal');break;case'hex':out(parseInt(document.getElementById('hexv').value||'0',16)+' decimal','Hex → decimal');break;case'subnet':out(Math.max(0,2**(32-n('prefix'))-2)+' usable hosts','Usable IPv4 hosts = 2^(32-prefix) − 2');break;case'storage':out((n('gb')*1024+n('mb')).toLocaleString()+' MB','GB × 1024 + MB');break;case'power':out((n('v')*n('i')).toFixed(2)+' W','P = V × I');break;case'battery':out((n('mah')/n('ma')).toFixed(2)+' hours','Runtime ≈ capacity / current');break;case'charge':out((n('mah')/n('ma')).toFixed(2)+' hours','Ideal charge time ≈ capacity / current');break;case'current':out((n('w')/n('v')).toFixed(3)+' A','I = P / V');break;case'fabric':out((n('area')/n('width')).toFixed(2)+' m','Fabric length = area / width');break;case'measure':out((n('base')*n('scale')).toFixed(2),'Adjusted measurement = base × scale');break;case'garment':out('₦'+(n('fabric')+n('labour')+n('other')).toLocaleString(),'Total cost = fabric + labour + other');break;case'yarn':out((n('weight')/n('length')).toFixed(3)+' g/m','Yarn density = weight / length');break;case'board':out((n('width')*n('thick')*n('length')/144).toFixed(2)+' board ft','Board feet = W × T × L / 144');break;case'woodcost':out('₦'+(n('unit')*n('n')).toLocaleString(),'Total = unit cost × quantity');break;case'cut':out((n('start')-n('cut')).toFixed(2)+' mm remaining','Remaining = starting length − cut');break;case'angle':out(Math.sqrt(n('a')**2+n('b')**2).toFixed(2),'Right triangle hypotenuse = √(a²+b²)');break;case'density':out((n('plants')/n('area')).toFixed(2)+' plants/m²','Density = plants / area');break;case'fertilizer':out((n('area')*n('rate')).toFixed(2)+' kg','Fertilizer = area × rate');break;case'yield':out((n('bags')*n('weight')).toFixed(2)+' kg','Yield = bags × weight per bag');break;case'farmarea':out((n('length')*n('width')).toFixed(2)+' m²','Area = length × width');break;case'recipe':out((n('target')/n('original')).toFixed(2)+'×','Scale factor = target / original');break;case'servings':out((n('food')/n('portion')).toFixed(2)+' servings','Servings = total food / portion');break;case'servcost':out('₦'+(n('cost')/n('serv')).toFixed(2),'Cost per serving = total cost / servings');break;case'ingcost':out('₦'+(n('qty')*n('unit')).toLocaleString(),'Ingredient cost = quantity × unit price');break;default:out('Select a calculator','Choose a departmental calculator above')}}catch(e){out('Check your values','Some inputs need valid numbers.')}}
render();
</script></body></html>
