name: Wire real Messenger UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Messenger wiring
        run: |
          # The generated JSX is inside a JS template literal. Escape interpolation
          # markers before executing the one-time source transformation.
          perl -0pi -e 's/\$\{/\\\$\{/g' scripts/wire-real-messages.mjs
          node scripts/wire-real-messages.mjs
      - name: Commit change
        run: |
          if git diff --quiet -- skillhub/src/App.tsx; then
            echo "Messenger UI already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillhub/src/App.tsx
          git commit -m "feat: connect Messenger UI to real API"
          git push
