name: Repair App source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.sha != '588efe900416d941ea2af82f237daaf060c058f0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore App.tsx from known-good commit
        run: |
          git show 588efe900416d941ea2af82f237daaf060c058f0:skillhub/src/App.tsx > skillhub/src/App.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('skillhub/src/App.tsx')
          s = p.read_text()
          s = s.replace("|| 'SkillHub member'", "|| 'OLANET member'")
          s = s.replace("'SkillHub member'", "'OLANET member'")
          s = s.replace('SkillHub community principle', 'OLANET community principle')
          s = s.replace('Search SkillHub', 'Search OLANET')
          s = s.replace('skillhub', 'OLANET')
          p.write_text(s)
          PY
          rm -f .github/workflows/repair-app.yml
          git config user.name 'OLANET Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skillhub/src/App.tsx .github/workflows/repair-app.yml
          git commit -m 'fix: restore OLANET app shell after source repair'
          git push origin main
